name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Run race tests
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: go test -race ./...

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tag
        id: tag
        run: echo "tag=$(date -u +%Y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"

      - name: Build and publish precompiled binaries
        uses: cli/gh-extension-precompile@76961aa3bd1123d0a6fd42d0a41aca0696937c39 # v2.2.0
        with:
          go_version_file: go.mod
          # The action's default Go cross-build path reaches targets that the desktop notification stack does not
          # compile for cleanly.
          build_script_override: .github/workflows/build-for-release
          release_tag: ${{ steps.tag.outputs.tag }}
          generate_attestations: true
